pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,mjs,ts,vue,json,md,yml,yaml,css,scss,html}'
      run: pnpm format:check:staged "{staged_files}"
      fail_text: '❌ Code formatting issues found. Run "pnpm format" to fix them and commit again.'
      skip_empty: true

    forbidden-branches:
      run: node scripts/check-branch.mjs

    eslint:
      glob: '*.{js,mjs,ts,vue}'
      run: pnpm lint:staged "{staged_files}"
      fail_text: '❌ ESLint found issues. Run "pnpm lint:fix" to fix them and push again.'
      skip_empty: true

    stylelint:
      glob: '*.{vue,css}'
      run: pnpm lint:css:staged "{staged_files}"
      fail_text: '❌ Stylelint found issues. Run "pnpm lint:css:fix" to fix them and commit again.'
      skip_empty: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
      skip:
        - merge
        - rebase

pre-push:
  commands:
    forbidden-branches:
      run: node scripts/check-branch.mjs

    typecheck:
      run: pnpm typecheck
      fail_text: '❌ TypeScript type checking failed. Please fix type errors and try again.'

    test:
      run: pnpm test:run
      fail_text: '❌ Tests failed. Fix failing tests and try again.'

post-checkout:
  commands:
    pnpm-install:
      files: git diff --name-only HEAD@{1} HEAD
      glob: '{package.json,pnpm-lock.yaml}'
      run: |
        pnpm install
        echo "⚠️  Dependencies changed - you may need to restart your dev server"

post-merge:
  commands:
    pnpm-install:
      files: git diff --name-only HEAD@{1} HEAD
      glob: '{package.json,pnpm-lock.yaml}'
      run: |
        pnpm install
        echo "⚠️  Dependencies changed - you may need to restart your dev server"

skip_output:
  - meta
  - success

colors: true
